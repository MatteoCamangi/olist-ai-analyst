version: 2

models:
  - name: stg_orders
    description: One row per order. order_status is the status at extraction time, with no history.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_purchase_timestamp
        data_tests:
          - not_null

  - name: stg_customers
    description: One row per customer_id. customer_id is order-level, so count people with customer_unique_id
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null
      - name: customer_state
        data_tests:
          - not_null

  - name: stg_order_items
    description: One row per item line in an order (order_id + order_item_id unique, 0 duplicates). Orders can have several items
    columns:
      - name: order_item_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id
      - name: price
        data_tests:
          - not_null

  - name: stg_order_payments
    description: One row per payment of an order (order_id + payment_sequential, 0 duplicates). An order can have several payment rows
    columns:
      - name: order_payment_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        data_tests:
          - not_null
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_order_reviews
    description: One row per review. An order can have several reviews
    columns:
      - name: review_order_key
        data_tests:
          - unique
          - not_null
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
      - name: review_answer_timestamp
        data_tests:
          - not_null

  - name: stg_products
    description: one row per product_id
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_sellers
    description: one row per seller_id
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_product_category_name_translation
    description: one row per category, one-to-one Portuguese to English
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null