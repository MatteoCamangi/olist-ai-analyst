version: 2

models:
  - name: int_orders_enriched
    description: One row per order with the status, dates and customer location that both facts share. Not for direct querying.
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - unique
      - name: customer_id
        description: "{{ doc('customer_id') }}"
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
      - name: order_purchase_day
        description: Calendar day of the purchase timestamp, as a date.
      - name: order_purchase_week
        description: Monday of the week of the purchase timestamp, as a date. Weeks run Monday to Sunday.
      - name: order_purchase_month
        description: First day of the month of the purchase timestamp, as a date.
      - name: order_status
        description: "{{ doc('order_status') }}"
      - name: order_status_group
        description: "{{ doc('order_status_group') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'in_flight', 'canceled', 'unavailable']
      - name: is_delivered
        description: "{{ doc('is_delivered') }}"
      - name: order_delivered_customer_date
        description: Timestamp when the order was delivered to the customer.
      - name: order_estimated_delivery_date
        description: Estimated delivery date shown to the customer at purchase.
      - name: delivery_days
        description: Calendar days from purchase to delivery. Null unless the order is delivered and has a delivery date.
      - name: is_late
        description: True when delivery fell on a later calendar day than the estimate. Null when not eligible (not delivered, or no delivery date), so count(is_late) is the eligible denominator.
      - name: customer_state
        description: Brazilian state (27 values) of the order's customer record. Location always comes from the order, not from the person.
      - name: customer_city
        description: City of the order's customer record, lowercase and without accents (for example `sao paulo`). The same city name exists in several states, so always use it together with `customer_state`.


  - name: int_orders_latest_reviews
    description: One row per order that has at least one review, with the score of its latest review. Orders without a review are absent (768), so left join it and keep a null score. Not for direct querying.
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - unique
      - name: review_id
        description: Identifier of the review that counted (the latest one of the order).
      - name: review_score
        description: Review score (1 to 5) of the latest review of the order.
        