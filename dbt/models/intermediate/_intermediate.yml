version: 2

models:
  - name: int_orders_enriched
    description: One row per order with the status, dates and customer location that both facts share. Not for direct querying.
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - unique
      - name: customer_id
        description: "{{ doc('customer_id') }}"
      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
      - name: order_purchase_timestamp
        description: "{{ doc('order_purchase_timestamp') }}"
      - name: order_purchase_day
        description: "{{ doc('order_purchase_day') }}"
      - name: order_purchase_week
        description: "{{ doc('order_purchase_week') }}"
      - name: order_purchase_month
        description: "{{ doc('order_purchase_month') }}"
      - name: order_status
        description: "{{ doc('order_status') }}"
      - name: order_status_group
        description: "{{ doc('order_status_group') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'in_flight', 'canceled', 'unavailable']
      - name: is_delivered
        description: "{{ doc('is_delivered') }}"
      - name: order_delivered_customer_date
        description: "{{ doc('order_delivered_customer_date') }}"
      - name: order_estimated_delivery_date
        description: "{{ doc('order_estimated_delivery_date') }}"
      - name: delivery_days
        description: "{{ doc('delivery_days') }}"
      - name: is_late
        description: "{{ doc('is_late') }}"
      - name: customer_state
        description: "{{ doc('customer_state') }}"
      - name: customer_city
        description: "{{ doc('customer_city') }}"


  - name: int_orders_latest_reviews
    description: One row per order that has at least one review, with the score of its latest review. Orders without a review are absent (768), so left join it and keep a null score. Not for direct querying.
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - unique
      - name: review_id
        description: Identifier of the review that counted (the latest one of the order).
      - name: review_score
        description: Review score (1 to 5) of the latest review of the order.
        
  - name: int_order_sellers
    description: One row per order and seller. An order with items from several sellers has several rows. Orders without items are absent. Never add up rows to count orders. Not for direct querying.
    columns:
      - name: order_seller_key
        description: Surrogate key of order_id and seller_id.
        data_tests:
          - unique
      - name: order_id
        description: "{{ doc('order_id') }}"
      - name: seller_id
        description: "{{ doc('seller_id') }}"
      - name: items_count
        description: Number of item lines of the order sold by this seller.
      - name: items_price
        description: Sum of item prices of the order sold by this seller.
      - name: items_freight_value
        description: Sum of item freight values of the order sold by this seller.
